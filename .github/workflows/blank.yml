
name: Hello GitHub Actions

on:
  push:
    branches: [ "master" ]

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo 'Hello, GitHub Actions!'

      - name: Say My Name
        run: echo 'My name is Katherine!'

  goodbye:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Say Goodbye
        run: echo 'Goodbye, GitHub!'
